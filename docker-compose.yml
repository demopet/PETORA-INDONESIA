services:
  app:
    build:
      context: .
      dockerfile: Dockerfile
    image: petora/app:local
    restart: unless-stopped
    env_file:
      - .env
    volumes:
      - ./:/var/www/html
      - storage:/var/www/html/storage
    depends_on:
      - db
      - redis
    ports:
      - "8000:80"

  db:
    image: postgres:17-alpine
    restart: unless-stopped
    environment:
      POSTGRES_DB: ${DB_DATABASE:-petora}
      POSTGRES_USER: ${DB_USERNAME:-petora}
      POSTGRES_PASSWORD: ${DB_PASSWORD:-secret}
    volumes:
      - dbdata:/var/lib/postgresql/data
    ports:
      - "5432:5432"
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${DB_USERNAME:-petora} -d ${DB_DATABASE:-petora}"]
      interval: 10s
      timeout: 5s
      retries: 5

  redis:
    image: redis:7-alpine
    restart: unless-stopped
    ports:
      - "6379:6379"
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 10s
      timeout: 5s
      retries: 5

  horizon:
    build:
      context: .
      dockerfile: Dockerfile
    restart: unless-stopped
    env_file:
      - .env
    command: php artisan horizon
    volumes:
      - ./:/var/www/html
      - storage:/var/www/html/storage
    depends_on:
      - app
      - redis
      - db

  scheduler:
    build:
      context: .
      dockerfile: Dockerfile
    restart: unless-stopped
    env_file:
      - .env
    command: php artisan schedule:work
    volumes:
      - ./:/var/www/html
      - storage:/var/www/html/storage
    depends_on:
      - app
      - redis
      - db

volumes:
  dbdata:
  storage:
